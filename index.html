<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Lanimalier — Sala de control</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  React "sin build": cargamos React y ReactDOM ya compilados desde un CDN,
  igual que hicimos con Supabase. Babel (también por CDN) transforma el
  JSX del <script type="text/babel"> de abajo directo en el navegador,
  así seguimos con un solo archivo HTML y sin instalar nada (npm, Vite,
  etc.). No es como se arma un proyecto React "de verdad" en una empresa,
  pero es perfecto para aprender sin agregar piezas nuevas al despliegue.
-->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --bg: #0a0e13;
    --panel: #12181f;
    --line: #232c36;
    --ink: #eef3f7;
    --ink-dim: #8fa1b0;
    --data: #4fb3ac;      /* color principal de datos */
    --accent: #ffb347;    /* acento: solo para lo que cambia / vivo */
    --bad: #e2574c;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; padding: 18px 26px 14px; gap:14px; }

  /* Encabezado */
  #topbar{ display:flex; align-items:baseline; justify-content:space-between; }
  #topbar h1{ font-size: 1.3rem; font-weight:600; margin:0; letter-spacing:.5px; color:var(--ink); }
  #status{ display:flex; align-items:center; gap:8px; font-size:.95rem; color:var(--ink-dim); }
  #dot{ width:12px; height:12px; border-radius:50%; background:var(--ink-dim); transition: background .2s; }
  #dot.live{ background:var(--data); }
  #dot.flash{ background:var(--accent); }

  /* KPIs grandes */
  #kpis{ display:grid; grid-template-columns: repeat(4,1fr); gap:16px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 22px; }
  .kpi .label{ font-size:1.05rem; color:var(--ink-dim); margin-bottom:6px; }
  .kpi .value{ font-size:4.6rem; font-weight:700; line-height:1; letter-spacing:-1px; }
  .kpi .value.flash{ color:var(--accent); }

  /* Grilla inferior */
  #grid{ flex:1; display:grid; grid-template-columns: 1.6fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap:16px; min-height:0; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; display:flex; flex-direction:column; min-height:0; }
  .panel h2{ font-size:1rem; font-weight:600; color:var(--ink-dim); margin:0 0 10px; text-transform:uppercase; letter-spacing:.5px; }
  .panel .body{ flex:1; min-height:0; position:relative; }

  #hourly{ grid-column:1; grid-row:1; }
  #comunas{ grid-column:2; grid-row:1; }
  #fuentes{ grid-column:3; grid-row:1; }
  #recientes{ grid-column:1 / span 3; grid-row:2; }

  /* Barra horaria */
  #hourlyChart{ display:flex; align-items:flex-end; gap:4px; height:100%; }
  .hbar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .hbar{ width:100%; background:var(--data); border-radius:3px 3px 0 0; min-height:2px; transition: height .3s ease; }
  .hbar.now{ background:var(--accent); }
  .hbar-label{ font-size:.68rem; color:var(--ink-dim); margin-top:4px; }

  /* Listas de barras (comunas / fuentes) */
  .barlist{ display:flex; flex-direction:column; gap:10px; justify-content:center; height:100%; }
  .barlist-row{ display:flex; flex-direction:column; gap:3px; }
  .barlist-top{ display:flex; justify-content:space-between; font-size:.92rem; }
  .barlist-name{ color:var(--ink); }
  .barlist-val{ color:var(--ink-dim); }
  .barlist-track{ height:9px; background:#1c2530; border-radius:5px; overflow:hidden; }
  .barlist-fill{ height:100%; background:var(--data); border-radius:5px; transition: width .3s ease; }

  /* Tabla últimas ventas */
  #recientes table{ width:100%; border-collapse:collapse; font-size:.98rem; }
  #recientes thead th{ text-align:left; color:var(--ink-dim); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.5px; padding:2px 10px 8px; border-bottom:1px solid var(--line); }
  #recientes tbody td{ padding:7px 10px; border-bottom:1px solid var(--line); }
  #recientes tbody tr.nuevo{ animation: flashrow 1.6s ease-out; }
  @keyframes flashrow{ 0%{ background: rgba(255,179,71,.35); } 100%{ background: transparent; } }
  #recientes .col-total{ text-align:right; font-variant-numeric: tabular-nums; }

  /* Estado vacío */
  .empty{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-dim); font-size:1rem; text-align:center; padding:10px; }

  /* Cerrar sesión */
  #topbarRight{ display:flex; align-items:center; gap:16px; }
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:6px; padding:5px 12px; font-size:.85rem; cursor:pointer;
    font-family: inherit;
  }
  #logoutBtn:hover{ color:var(--ink); border-color:var(--ink-dim); }

  /* Login */
  .login-overlay{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:36px 40px; width:320px; display:flex; flex-direction:column; gap:14px;
  }
  .login-card h1{ margin:0; font-size:1.3rem; color:var(--ink); }
  .login-sub{ margin:0; color:var(--ink-dim); font-size:.9rem; }
  .login-card label{ display:flex; flex-direction:column; gap:6px; font-size:.85rem; color:var(--ink-dim); }
  .login-card input{
    background:#1c2530; border:1px solid var(--line); border-radius:6px; color:var(--ink);
    padding:9px 10px; font-size:1rem; font-family:inherit;
  }
  .login-card input:focus{ outline:1px solid var(--data); }
  .login-card button{
    margin-top:6px; background:var(--data); color:#04211f; border:none; border-radius:6px;
    padding:10px; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .login-card button:hover{ opacity:.9; }
  .login-error{ color:var(--bad); font-size:.85rem; min-height:1.1em; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
"use strict";

/* ============================================================
   Config y constantes — igual que antes, fuera de cualquier
   componente. React no cambia nada acá: esto no es "estado de
   pantalla", es configuración fija.
   ============================================================ */
const SUPABASE_URL = "https://db.lanimalier.cl";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbmltYWxpZXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4Njc1NDcyMSwiZXhwIjoyMTAyMTE0NzIxfQ.17qeMGwPJ7KVKgiU__fYEk1UzGhqdLrBZtQ2cUeY1EU";
const SCHEMA = "lanimalier";
const TABLE = "ventas";
const MAX_RECIENTES = 15;
const FLUSH_MS = 500;

const USUARIO_VALIDO = "test";
const CLAVE_VALIDA = "password1";
const CLAVE_SESION = "lanimalier_sesion";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: SCHEMA }
});

function fechaLocalHoy(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function inicioDeHoyISO(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.toISOString();
}

/* ---------- Formato ---------- */
function formatoPesosAbrev(monto){
  const signo = monto < 0 ? "-" : "";
  const n = Math.abs(monto);
  if (n >= 1_000_000) return signo + "$" + (n/1_000_000).toFixed(1).replace(".", ",") + " M";
  if (n >= 1_000) return signo + "$" + Math.round(n/1_000) + " K";
  return signo + "$" + n;
}
function formatoEntero(n){
  return new Intl.NumberFormat("es-CL").format(n);
}
function formatoHora(fechaIso){
  const d = new Date(fechaIso);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
// Nota para quien viene de la versión sin React: antes existía una función
// escapeHtml() a mano, porque armábamos el HTML pegando texto con
// innerHTML (si un dato traía "<script>" adentro, se ejecutaría). JSX
// escapa automáticamente todo lo que pones entre llaves {así}, así que
// esa función ya no hace falta — es una de las cosas que React hace
// más seguras por defecto.

/* ---------- Consultas a la base (iguales a antes) ---------- */
async function cargarHistorialDeHoy(){
  const desde = inicioDeHoyISO();
  const pageSize = 1000;
  let from = 0;
  let filas = [];
  while (true){
    const { data, error } = await client
      .from(TABLE)
      .select("id,ocurrido_en,total,unidades,ciudad,fuente")
      .eq("estado", "placed")
      .gte("ocurrido_en", desde)
      .order("id", { ascending: true })
      .range(from, from + pageSize - 1);
    if (error) throw error;
    if (!data || data.length === 0) break;
    filas = filas.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return filas;
}

async function cargarVentasNuevasDesde(ultimoId){
  const { data, error } = await client
    .from(TABLE)
    .select("id,ocurrido_en,total,unidades,ciudad,fuente")
    .eq("estado", "placed")
    .gt("id", ultimoId)
    .order("id", { ascending: true })
    .limit(5000);
  if (error) throw error;
  return data || [];
}

/* ---------- Acumulador (misma idea que el "state" de antes) ----------
   Este objeto se sigue mutando directo, igual que en la versión anterior:
   sumar 30 mil filas una por una creando un objeto nuevo cada vez sería
   lento y no aporta nada. La diferencia con React es que este objeto NO
   es lo que se pinta en pantalla — es la "libreta de apuntes" interna.
   Cuando termina de actualizarse, sacamos una copia liviana (plana) y
   esa copia es la que entra a React vía setState, para que la pantalla
   se vuelva a pintar. */
function estadoVacio(){
  return {
    ventas: 0,
    facturacion: 0,
    unidades: 0,
    porHora: new Array(24).fill(0),
    porComuna: {},   // antes era un Map; como objeto plano es más cómodo
    porFuente: {},   // para copiarlo y para recorrerlo desde JSX
    recientes: [],
    maxIdVisto: 0,
    tieneDatos: false,
    cargando: true
  };
}

function aplicarVenta(acc, v){
  acc.ventas += 1;
  acc.facturacion += v.total || 0;
  acc.unidades += v.unidades || 0;
  const hora = new Date(v.ocurrido_en).getHours();
  acc.porHora[hora] += (v.total || 0);
  const comuna = v.ciudad || "Sin dato";
  acc.porComuna[comuna] = (acc.porComuna[comuna] || 0) + 1;
  const fuente = v.fuente || "Sin dato";
  acc.porFuente[fuente] = (acc.porFuente[fuente] || 0) + 1;
  if (v.id > acc.maxIdVisto) acc.maxIdVisto = v.id;
}

// Arma la lista de "últimas ventas" a partir de la carga inicial.
// Ninguna se marca como "nueva" (no hay que hacer destellar nada recién
// abierta la página).
function recientesIniciales(filas){
  return filas.slice(-MAX_RECIENTES).reverse().map(v => ({ ...v, _nueva: false }));
}

function copiaPlana(acc){
  return {
    ventas: acc.ventas,
    facturacion: acc.facturacion,
    unidades: acc.unidades,
    porHora: [...acc.porHora],
    porComuna: { ...acc.porComuna },
    porFuente: { ...acc.porFuente },
    recientes: acc.recientes,
    tieneDatos: acc.tieneDatos,
    cargando: acc.cargando
  };
}

/* ============================================================
   useVentasEnVivo — un "hook" propio.
   Un hook no es más que una función que empieza con "use" y que puede
   usar useState/useEffect/useRef por dentro. Sirve para sacar toda la
   lógica de "cómo se consiguen los datos" fuera del componente que
   solo se preocupa de "cómo se ven".
   ============================================================ */
function useVentasEnVivo(){
  // Esto SÍ dispara un repintado cuando cambia: es lo que se muestra.
  const [snapshot, setSnapshot] = React.useState(estadoVacio);
  const [conexion, setConexion] = React.useState("cargando"); // cargando | en-vivo | reconectando
  const [flash, setFlash] = React.useState(false);

  // useRef guarda un valor que sobrevive entre renders PERO que, a
  // diferencia de useState, cambiarlo no vuelve a pintar la pantalla.
  // Es justo lo que necesitamos para el acumulador (se actualiza
  // constantemente, muchas veces por segundo durante una ráfaga) y para
  // "diaLocal" (solo lo necesitan las funciones de abajo, a la pantalla
  // no le importa directamente).
  const accRef = React.useRef(estadoVacio());
  const bufferRef = React.useRef([]);
  const diaLocalRef = React.useRef(fechaLocalHoy());

  React.useEffect(() => {
    // "detenido" evita que trabajo async que quedó pendiente (una
    // consulta que todavía no responde, un setTimeout de reconexión)
    // intente actualizar el estado después de que este componente ya
    // se desmontó — por ejemplo, apenas alguien hace clic en "Cerrar
    // sesión". Es un patrón muy común en React.
    let detenido = false;
    let canal = null;
    let flushId = null;
    let syncId = null;
    let cargaInicialLista = false;
    let canalConectado = false;
    let seConectoAlgunaVez = false;
    let sincronizando = false;

    function actualizarConexion(){
      if (!cargaInicialLista) setConexion("cargando");
      else if (canalConectado) setConexion("en-vivo");
      else setConexion("reconectando");
    }

    function publicarSnapshot(){
      setSnapshot(copiaPlana(accRef.current));
    }

    function dispararFlash(){
      setFlash(true);
      setTimeout(() => { if (!detenido) setFlash(false); }, 700);
    }

    function reiniciarPorNuevoDia(){
      accRef.current = estadoVacio();
      accRef.current.cargando = false;
      diaLocalRef.current = fechaLocalHoy();
      publicarSnapshot();
    }

    // Procesa lo acumulado en el buffer. A diferencia de la versión
    // anterior, acá armamos primero la lista de filas realmente nuevas
    // y recién al final tocamos "recientes" una sola vez: así solo las
    // filas de ESTE lote quedan marcadas "_nueva" (la versión anterior
    // tenía un detalle ahí — una fila podía quedar marcada como nueva
    // para siempre y destellar de nuevo en cada actualización futura).
    function procesarBuffer(animar){
      const hoyAhora = fechaLocalHoy();
      if (hoyAhora !== diaLocalRef.current){
        reiniciarPorNuevoDia();
        return;
      }
      if (bufferRef.current.length === 0) return;

      const lote = bufferRef.current;
      bufferRef.current = [];

      const nuevas = [];
      for (const fila of lote){
        if (fila.id <= accRef.current.maxIdVisto) continue; // ya contada antes
        aplicarVenta(accRef.current, fila);
        nuevas.push(fila);
      }

      if (nuevas.length > 0){
        const anteriores = accRef.current.recientes.map(r => ({ ...r, _nueva: false }));
        const frescas = nuevas.slice(-MAX_RECIENTES).reverse().map(v => ({ ...v, _nueva: true }));
        accRef.current.recientes = [...frescas, ...anteriores].slice(0, MAX_RECIENTES);
        accRef.current.tieneDatos = true;
        publicarSnapshot();
        if (animar) dispararFlash();
      }
    }

    async function sincronizarConBase(){
      if (sincronizando) return;
      sincronizando = true;
      try {
        const faltantes = await cargarVentasNuevasDesde(accRef.current.maxIdVisto);
        if (!detenido && faltantes.length > 0) bufferRef.current.push(...faltantes);
      } catch (e) {
        console.error("Error sincronizando con la base:", e);
      } finally {
        sincronizando = false;
      }
    }

    function conectarRealtime(){
      if (canal) client.removeChannel(canal);
      canal = client
        .channel("ventas-en-vivo")
        .on("postgres_changes",
          { event: "INSERT", schema: SCHEMA, table: TABLE, filter: "estado=eq.placed" },
          (payload) => { bufferRef.current.push(payload.new); }
        )
        .subscribe((estado) => {
          if (detenido) return;
          if (estado === "SUBSCRIBED"){
            canalConectado = true;
            actualizarConexion();
            if (seConectoAlgunaVez && cargaInicialLista) sincronizarConBase();
            seConectoAlgunaVez = true;
          } else if (estado === "CHANNEL_ERROR" || estado === "TIMED_OUT" || estado === "CLOSED"){
            canalConectado = false;
            actualizarConexion();
            setTimeout(() => { if (!detenido) conectarRealtime(); }, 3000);
          }
        });
    }

    function alVolverVisible(){
      if (document.visibilityState === "visible" && cargaInicialLista){
        procesarBuffer(false);
        sincronizarConBase();
      }
    }

    async function iniciar(){
      conectarRealtime();
      try {
        const filas = await cargarHistorialDeHoy();
        if (detenido) return;
        accRef.current = estadoVacio();
        for (const fila of filas) aplicarVenta(accRef.current, fila);
        accRef.current.recientes = recientesIniciales(filas);
        accRef.current.tieneDatos = accRef.current.ventas > 0;
      } catch (e) {
        console.error("Error cargando historial:", e);
      }
      if (detenido) return;

      accRef.current.cargando = false;
      cargaInicialLista = true;
      publicarSnapshot();
      actualizarConexion();

      flushId = setInterval(() => procesarBuffer(true), FLUSH_MS);
      syncId = setInterval(sincronizarConBase, 30000);
      document.addEventListener("visibilitychange", alVolverVisible);
    }

    iniciar();

    // La función que retorna un useEffect es su "limpieza": React la
    // llama automáticamente cuando el componente se desmonta (acá, al
    // cerrar sesión). Antes esto lo resolvíamos recargando la página
    // entera con location.reload() — ahora cortamos la conexión en vivo
    // y los temporizadores "a mano", de forma prolija.
    return () => {
      detenido = true;
      if (flushId) clearInterval(flushId);
      if (syncId) clearInterval(syncId);
      document.removeEventListener("visibilitychange", alVolverVisible);
      if (canal) client.removeChannel(canal);
    };
  }, []); // [] = "arrancar una sola vez, al montar"

  return { ...snapshot, conexion, flash };
}

/* ============================================================
   Componentes de presentación — cada uno recibe datos por props y
   decide cómo pintarlos. No saben nada de Supabase ni de buffers.
   ============================================================ */

function StatusDot({ conexion, flash }){
  let clase = "";
  if (flash) clase = "flash";
  else if (conexion === "en-vivo") clase = "live";
  const texto = conexion === "en-vivo" ? "en vivo"
    : conexion === "reconectando" ? "reconectando…"
    : "cargando…";
  return (
    <div id="status">
      <span id="dot" className={clase}></span>
      <span>{texto}</span>
    </div>
  );
}

function Kpi({ label, valor, flash }){
  return (
    <div className="kpi">
      <div className="label">{label}</div>
      <div className={"value" + (flash ? " flash" : "")}>{valor}</div>
    </div>
  );
}

function Kpis({ datos }){
  const cargando = datos.cargando;
  const sinDatos = !datos.tieneDatos;
  const ticket = datos.ventas ? Math.round(datos.facturacion / datos.ventas) : 0;
  const valor = (conDatos, vacio) => cargando ? "—" : (sinDatos ? vacio : conDatos);
  return (
    <div id="kpis">
      <Kpi label="Ventas de hoy" flash={datos.flash}
           valor={valor(formatoEntero(datos.ventas), "0")} />
      <Kpi label="Facturación de hoy" flash={datos.flash}
           valor={valor(formatoPesosAbrev(datos.facturacion), "$0")} />
      <Kpi label="Ticket promedio" flash={datos.flash}
           valor={valor(formatoPesosAbrev(ticket), "$0")} />
      <Kpi label="Unidades vendidas" flash={datos.flash}
           valor={valor(formatoEntero(datos.unidades), "0")} />
    </div>
  );
}

function FacturacionPorHora({ datos }){
  if (datos.cargando) return <div className="empty">Cargando ventas de hoy…</div>;
  if (!datos.tieneDatos) return <div className="empty">Todavía no hay ventas hoy</div>;

  const horaActual = new Date().getHours();
  const maxVal = Math.max(1, ...datos.porHora);
  return (
    <div id="hourlyChart">
      {datos.porHora.map((val, h) => {
        const alturaPct = Math.max(2, Math.round((val / maxVal) * 100));
        const esAhora = h === horaActual;
        return (
          <div className="hbar-col" key={h} title={h + "h — " + formatoPesosAbrev(val)}>
            <div className={"hbar" + (esAhora ? " now" : "")} style={{ height: alturaPct + "%" }}></div>
            <div className="hbar-label">{h % 3 === 0 ? h + "h" : ""}</div>
          </div>
        );
      })}
    </div>
  );
}

function TopLista({ datos, mapa, mostrarPorcentaje }){
  if (datos.cargando) return <div className="empty">Cargando ventas de hoy…</div>;
  const entradas = Object.entries(mapa);
  if (!datos.tieneDatos || entradas.length === 0) return <div className="empty">Todavía no hay datos hoy</div>;

  const items = entradas.sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = items[0][1];
  const total = mostrarPorcentaje ? entradas.reduce((acc, [, v]) => acc + v, 0) : null;

  return (
    <div className="barlist">
      {items.map(([nombre, valor]) => {
        const pct = Math.round((valor / max) * 100);
        const pctTotal = total ? Math.round((valor / total) * 100) : null;
        return (
          <div className="barlist-row" key={nombre}>
            <div className="barlist-top">
              <span className="barlist-name">{nombre}</span>
              <span className="barlist-val">
                {formatoEntero(valor)}{pctTotal !== null ? " · " + pctTotal + "%" : ""}
              </span>
            </div>
            <div className="barlist-track">
              <div className="barlist-fill" style={{ width: pct + "%" }}></div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function UltimasVentas({ datos }){
  if (datos.cargando) return <div className="empty">Cargando ventas de hoy…</div>;
  if (!datos.tieneDatos || datos.recientes.length === 0){
    return <div className="empty">Todavía no hay ventas registradas hoy — el sistema está a la espera</div>;
  }
  return (
    <table>
      <thead>
        <tr><th>Hora</th><th>Comuna</th><th>Origen</th><th>Unid.</th><th className="col-total">Total</th></tr>
      </thead>
      <tbody>
        {datos.recientes.map(v => (
          // "key" le dice a React qué fila es cuál entre renders — acá
          // usamos el id real de la venta, que nunca se repite.
          <tr key={v.id} className={v._nueva ? "nuevo" : ""}>
            <td>{formatoHora(v.ocurrido_en)}</td>
            <td>{v.ciudad || "—"}</td>
            <td>{v.fuente || "—"}</td>
            <td>{formatoEntero(v.unidades || 0)}</td>
            <td className="col-total">{formatoPesosAbrev(v.total || 0)}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function Dashboard({ onLogout }){
  const datos = useVentasEnVivo();
  return (
    <div id="app">
      <div id="topbar">
        <h1>Lanimalier · ventas en vivo</h1>
        <div id="topbarRight">
          <StatusDot conexion={datos.conexion} flash={datos.flash} />
          <button id="logoutBtn" type="button" onClick={onLogout}>Cerrar sesión</button>
        </div>
      </div>

      <Kpis datos={datos} />

      <div id="grid">
        <div className="panel" id="hourly">
          <h2>Facturación por hora</h2>
          <div className="body"><FacturacionPorHora datos={datos} /></div>
        </div>
        <div className="panel" id="comunas">
          <h2>Comunas que más compran</h2>
          <div className="body"><TopLista datos={datos} mapa={datos.porComuna} /></div>
        </div>
        <div className="panel" id="fuentes">
          <h2>Origen del tráfico</h2>
          <div className="body"><TopLista datos={datos} mapa={datos.porFuente} mostrarPorcentaje /></div>
        </div>
        <div className="panel" id="recientes">
          <h2>Últimas ventas</h2>
          <div className="body"><UltimasVentas datos={datos} /></div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Login ---------- */
// Simple, sin base de datos: usuario y clave quedan embebidos acá mismo.
// Esto NO es seguridad real (cualquiera que mire el código los puede
// leer), es solo una cortina para que no cualquiera que llegue al link
// caiga directo en el tablero.
function guardarSesion(){
  try { sessionStorage.setItem(CLAVE_SESION, "1"); } catch (e) {}
}
function borrarSesion(){
  try { sessionStorage.removeItem(CLAVE_SESION); } catch (e) {}
}
function sesionActivaInicial(){
  try { return sessionStorage.getItem(CLAVE_SESION) === "1"; }
  catch (e) { return false; }
}

function LoginScreen({ onLogin }){
  // Cada input queda "controlado" por React: su valor vive en useState,
  // no en el DOM. Es el patrón estándar de formularios en React.
  const [usuario, setUsuario] = React.useState("");
  const [clave, setClave] = React.useState("");
  const [error, setError] = React.useState("");
  const usuarioRef = React.useRef(null);

  React.useEffect(() => {
    if (usuarioRef.current) usuarioRef.current.focus();
  }, []);

  function manejarEnvio(ev){
    ev.preventDefault();
    if (usuario === USUARIO_VALIDO && clave === CLAVE_VALIDA){
      guardarSesion();
      onLogin();
    } else {
      setError("Usuario o contraseña incorrectos.");
      setClave("");
    }
  }

  return (
    <div className="login-overlay">
      <form className="login-card" autoComplete="off" onSubmit={manejarEnvio}>
        <h1>Lanimalier</h1>
        <p className="login-sub">Ingresa para ver el tablero de ventas</p>
        <label>Usuario
          <input ref={usuarioRef} type="text" autoComplete="username"
                 value={usuario} onChange={e => setUsuario(e.target.value)} />
        </label>
        <label>Contraseña
          <input type="password" autoComplete="current-password"
                 value={clave} onChange={e => setClave(e.target.value)} />
        </label>
        <div className="login-error">{error}</div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  );
}

function App(){
  // El estado más "arriba" de todos: ¿hay sesión o no? De eso depende
  // qué pantalla completa se muestra.
  const [sesion, setSesion] = React.useState(sesionActivaInicial);

  if (!sesion){
    return <LoginScreen onLogin={() => setSesion(true)} />;
  }

  // Al desmontar <Dashboard/> (sesion pasa a false), el useEffect de
  // useVentasEnVivo corre su limpieza solo: cierra el canal en vivo y
  // los temporizadores. Por eso el logout ya no necesita recargar la
  // página como antes.
  return <Dashboard onLogout={() => { borrarSesion(); setSesion(false); }} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
